<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>会員一覧</title>
</head>
<body>
    <h1>会員一覧</h1>
    <table border="1">
        <thead>
            <tr><th>ID</th><th>名前</th><th>ランク</th><th>ランクの説明</th></tr>
        </thead>
        <tbody>
            <tr th:each="member : ${members}">
                <td th:text="${member.id}"></td>
                <td th:text="${member.name}"></td>
                <td th:text="${member.rank}"></td>
                <!-- ランクの説明を th:switch / th:case で切り替え -->
                <td th:switch="${member.rank}">
                    <span th:case="'GOLD'">ゴールド会員(特典: 10%割引)</span>
                    <span th:case="'SILVER'">シルバー会員(特典: 5%割引)</span>
                    <span th:case="'BRONZE'">ブロンズ会員(特典: ポイント2倍)</span>
                    <span th:case="*">一般会員</span>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
