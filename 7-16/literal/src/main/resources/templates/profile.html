<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>プロフィール</title>
</head>
<body>
    <!-- 1行目(見出し)・2行目: リテラル置換 -->
    <h1 th:text="|${name}さんのプロフィール|">名前さんのプロフィール</h1>
    <p th:text="|年齢: ${age}歳|">年齢: 0歳</p>
    <!-- 3行目: インライン処理 -->
    <p>趣味: [[${hobby}]]</p>
</body>
</html>
