<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ダッシュボード</title>
</head>
<body>
    <h1>顧客情報</h1>
    <p>名前: <span th:text="${customer.name}"></span></p>
    <p>メールアドレス: <span th:text="${customer.email}"></span></p>
    <h2>商品リスト</h2>
    <ul>
        <li th:each="item : ${items}" th:text="${item.name} + ' - ¥' + ${item.price}"></li>
    </ul>
</body>
</html>
