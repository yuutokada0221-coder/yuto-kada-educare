name: CI

# ★push/PRのたびに自動でテストを走らせる。テストはH2インメモリDBで完結するため、
# 実際のPostgres（本番のhabit_app）には一切触れない。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test
