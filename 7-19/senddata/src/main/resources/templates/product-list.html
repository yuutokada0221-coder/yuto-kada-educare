<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品一覧</title>
</head>
<body>
    <h1>商品一覧</h1>
    <ul>
        <li th:each="product : ${products}">
            <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">商品名</a>
            <span th:text="|（価格: ${product.price}円）|">（価格: 円）</span>
        </li>
    </ul>
</body>
</html>
