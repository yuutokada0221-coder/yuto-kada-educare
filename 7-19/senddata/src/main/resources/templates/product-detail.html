<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品詳細</title>
</head>
<body>
    <h1>商品詳細</h1>
    <p th:text="|ID: ${product.id}|">ID:</p>
    <p th:text="|名前: ${product.name}|">名前:</p>
    <p th:text="|価格: ${product.price}円|">価格:</p>
    <a th:href="@{/products}">← 商品一覧へ戻る</a>
</body>
</html>
