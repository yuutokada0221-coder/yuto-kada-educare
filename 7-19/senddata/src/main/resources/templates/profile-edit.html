<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>プロフィール編集</title>
</head>
<body>
    <h1>プロフィール編集</h1>
    <form th:action="@{/profile/confirm}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{id}">
        <label for="name">名前:</label> <input type="text" th:field="*{name}"><br>
        <label for="age">年齢:</label> <input type="text" th:field="*{age}"><br>
        <label for="bio">自己紹介:</label> <textarea th:field="*{bio}"></textarea><br>
        <button type="submit">確認</button>
    </form>
</body>
</html>
