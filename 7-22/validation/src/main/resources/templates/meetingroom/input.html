<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>会議室予約フォーム</title>
</head>
<body>
    <h1>会議室予約フォーム</h1>
    <form th:action="@{/meetingroom/confirm}" th:object="${form}" method="post">
        <label for="roomName">会議室名：</label>
        <select id="roomName" th:field="*{roomName}">
            <option value="">選択してください</option>
            <option value="小会議室">小会議室</option>
            <option value="大会議室">大会議室</option>
        </select><br>
        <span th:if="${#fields.hasErrors('roomName')}" th:errors="*{roomName}"></span>
        <label for="startDateTime">利用開始日時：</label>
        <input type="datetime-local" id="startDateTime" name="startDateTime" th:value="${form.startDateTime}"><br>
        <span th:if="${#fields.hasErrors('startDateTime')}" th:errors="*{startDateTime}"></span>
        <label for="endDateTime">利用終了日時：</label>
        <input type="datetime-local" id="endDateTime" name="endDateTime" th:value="${form.endDateTime}"><br>
        <span th:if="${#fields.hasErrors('endDateTime')}" th:errors="*{endDateTime}"></span>
        <label for="peopleCount">利用人数：</label>
        <input type="text" id="peopleCount" th:field="*{peopleCount}"><br>
        <span th:if="${#fields.hasErrors('peopleCount')}" th:errors="*{peopleCount}"></span>
        <p><button type="submit">確認</button></p>
    </form>
</body>
</html>
