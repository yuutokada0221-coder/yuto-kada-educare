# ★夜のジャーナルタブのAI成長分析機能で使うOpenAI API設定。
# デフォルトは空文字＝未設定として扱われ、その場合は分析生成をスキップする（アプリは落ちない）。
# 実際に使うにはOPENAI_API_KEYを環境変数で設定してください。
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=${OPENAI_API_MODEL:gpt-4o-mini}
openai.api.base-url=${OPENAI_API_BASE_URL:https://api.openai.com/v1}

# ★死活監視用。/actuator/healthは未認証でも見られるよう公開し、/actuator/prometheus（メトリクス）は
# 内部情報を含むため他のactuatorエンドポイント同様に通常の認証を必要とするままにしておく
# （SecurityConfigでpermitAllしているのは/actuator/healthのみ）。
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# メール未設定（ダミーSMTP）は「アプリが壊れている」ことを意味しないため、
# メールのヘルスチェックだけは対象から外す（含めたままだと常にDOWNになり、本当の異常を見逃す原因になる）。
management.health.mail.enabled=false
