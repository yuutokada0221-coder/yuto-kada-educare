# アプリの名前
spring.application.name=demo

# PostgreSQLへの接続設定
# ★${環境変数名:デフォルト値} の形式にしておくことで、ローカルでは今まで通りノータッチで動きつつ、
# 本番デプロイ時は環境変数（DB_URL/DB_USERNAME/DB_PASSWORD等）で上書きできる。
# パスワードなどの秘密情報をこのファイルに直書きしないための一般的なプラクティス。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/habit_app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ★スキーマはFlyway（src/main/resources/db/migration配下のSQL）で管理する。
# Hibernateはエンティティ定義とDBスキーマが一致しているかを検証するだけで、
# 自動でテーブルを変更することはしない（以前のddl-auto=updateはNOT NULLカラム追加が
# 何度も静かに失敗する原因になっていたため、バージョン管理された明示的なマイグレーションに切り替えた）。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ★既存の本番DB（habit_appはこれまでddl-auto=updateで育ってきた）を、V1__baseline.sqlが
# 表す状態まで既に到達済みとして扱う。まっさらなDB（CIやテスト環境）ではV1から通常通り実行される。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ★HTTPセッションをアプリ再起動をまたいで維持するため、DBに永続化する
# （それまでは開発中にサーバーを再起動するたび全員ログアウトされていた）。
# テーブルはV2__spring_session.sqlで作成済みなので、Spring Session側の自動初期化は無効にしておく。
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

# Lv30の背景画像アップロード：サイズ上限（不正な巨大ファイルでのDoS対策）
# スマホ写真は5MBを超えることが多いため、実用的な上限として15MBに設定
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
# ★組み込みTomcatにはSpringの設定と別に「フォーム/multipartのPOSTサイズ上限」がデフォルト2MBで存在する。
# これを上げないと、上のSpring側の設定を15MBにしても実際にはTomcatの段階で先に弾かれてしまう
# （BackgroundControllerまで処理が届かず、真っ白な413エラーになっていた実際の原因）。
# サイズ判定はSpring側(max-file-size/max-request-size)に一本化したいので、Tomcat側は無制限にしておく。
server.tomcat.max-http-form-post-size=-1

# ★パスワードリセットメールの送信設定。
# デフォルト値はダミーのため、このままでは実際にメールは届かない（送信失敗はログに記録されるだけでアプリは落ちない）。
# 実際に送信したい場合は、環境変数MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORDを設定してください
# （直接このファイルを書き換えても動くが、認証情報を平文でファイルに残さないよう環境変数を推奨）。
# 例）Gmailの場合：MAIL_HOST=smtp.gmail.com、Googleアカウントで発行した「アプリパスワード」をMAIL_PASSWORDに設定
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@example.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# メール本文中のリンクに使うアプリのベースURL（本番環境にデプロイしたら環境変数APP_BASE_URLで上書きする）
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ★Webプッシュ通知用のVAPID鍵ペア（このアプリ専用に生成済み。差し替えると既存の購読が全て無効になるので注意）。
# 秘密鍵はサーバーだけが使う。公開鍵はブラウザ側のsubscribe()にも渡される。
# デフォルト値はこのローカル開発用に生成したものをそのまま入れてあるので、環境変数を設定しなくてもこれまで通り動く。
# 本番デプロイ時はPUSH_VAPID_PRIVATE_KEYを環境変数で渡し、このファイルには秘密鍵を残さない運用が望ましい。
push.vapid.public-key=${PUSH_VAPID_PUBLIC_KEY:BMK0R8sJ3bm6Cy4N1lTkwRgBS3f6BgYmGjEiBzgGCOvQod8OXQJt7NSEW39r1XylaOKw5WCvWUrL6hvFUsD_1VI}
push.vapid.private-key=${PUSH_VAPID_PRIVATE_KEY:SBYhIjvE8tSBOg6D0Uul_uTFK7UblsBrAXupqwSCkvU}
push.vapid.subject=${PUSH_VAPID_SUBJECT:mailto:admin@example.com}

# ★死活監視用。/actuator/healthは未認証でも見られるよう公開し、/actuator/prometheus（メトリクス）は
# 内部情報を含むため他のactuatorエンドポイント同様に通常の認証を必要とするままにしておく
# （SecurityConfigでpermitAllしているのは/actuator/healthのみ）。
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# メール未設定（ダミーSMTP）は「アプリが壊れている」ことを意味しないため、
# メールのヘルスチェックだけは対象から外す（含めたままだと常にDOWNになり、本当の異常を見逃す原因になる）。
management.health.mail.enabled=false
