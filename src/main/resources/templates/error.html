<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エラーが発生しました - 目標達成RPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <span class="icon-badge tint-danger" style="margin: 0 auto;"><svg class="icon"><use href="/icons.svg#i-alert"></use></svg></span>
            <h2 class="mt-3">エラーが発生しました<span th:if="${status}" th:text="'（' + ${status} + '）'"></span></h2>
            <p class="text-muted text-sm mt-1 mb-0">操作を続けられませんでした。ホームからやり直してください。</p>
            <a href="/" class="btn-duo btn-primary mt-4" style="text-decoration: none;">ホームに戻る</a>
        </div>
    </div>
</body>
</html>
