<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードをお忘れですか？ - 目標達成RPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <span class="icon-badge tint-secondary" style="margin: 0 auto;"><svg class="icon"><use href="/icons.svg#i-key"></use></svg></span>
            <h2 class="mt-3">パスワードの再設定</h2>
            <p class="text-muted text-sm mt-1 mb-0">登録済みのメールアドレスを入力してください</p>

            <div th:if="${sent}" class="auth-success mt-4">
                入力されたメールアドレスが登録済みであれば、パスワード再設定のご案内を送信しました。<br>
                メールをご確認ください（届かない場合は迷惑メールフォルダもご確認ください）。
            </div>

            <form th:if="${sent == null}" th:action="@{/forgot-password}" method="post" class="mt-4">
                <input type="email" name="email" placeholder="登録済みのメールアドレス" required>
                <button type="submit" class="btn-duo btn-primary">再設定メールを送る</button>
            </form>

            <a href="/login" class="auth-link">ログイン画面に戻る</a>
        </div>
    </div>
</body>
</html>
