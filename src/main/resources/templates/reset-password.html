<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新しいパスワードを設定 - 目標達成RPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <span class="icon-badge tint-secondary" style="margin: 0 auto;"><svg class="icon"><use href="/icons.svg#i-key"></use></svg></span>
            <h2 class="mt-3">新しいパスワードを設定</h2>

            <div th:if="${invalid}" class="auth-error mt-4">
                このリンクは無効か、有効期限（30分）が切れています。<br>
                お手数ですが、もう一度パスワード再設定をやり直してください。
            </div>

            <div th:if="${passwordError}" class="auth-error mt-4" th:text="${passwordError}"></div>

            <form th:if="${invalid == null}" th:action="@{/reset-password}" method="post" class="mt-4">
                <input type="hidden" name="token" th:value="${token}">
                <input type="password" name="newPassword" placeholder="新しいパスワード（英数字含む8文字以上）" required minlength="8">
                <button type="submit" class="btn-duo btn-primary">パスワードを更新する</button>
            </form>

            <a th:if="${invalid}" href="/forgot-password" class="auth-link">もう一度リクエストする</a>
            <a th:if="${invalid == null}" href="/login" class="auth-link">ログイン画面に戻る</a>
        </div>
    </div>
</body>
</html>
