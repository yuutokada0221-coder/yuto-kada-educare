<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 目標達成RPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <h1><svg class="icon icon-lg"><use href="/icons.svg#i-mark"></use></svg></h1>
            <h2>おかえりなさい</h2>
            <p class="text-muted text-sm mt-1 mb-0">冒険の続きを始めよう</p>

            <div th:if="${param.error != null and param.error[0] == 'locked'}" class="auth-error mt-4">
                ログイン試行が多すぎます。しばらく時間をおいてから再度お試しください。
            </div>
            <div th:if="${param.error != null and param.error[0] != 'locked'}" class="auth-error mt-4">名前かパスワードが違います</div>
            <div th:if="${param.logout}" class="auth-success mt-4">ログアウトしました。</div>
            <div th:if="${param.resetSuccess}" class="auth-success mt-4">パスワードを更新しました。新しいパスワードでログインしてください。</div>

            <div class="tab-buttons mt-4" style="margin-bottom: 18px;">
                <button type="button" class="tab-btn active" id="userModeBtn" onclick="setLoginMode('user')">
                    <svg class="icon icon-sm"><use href="/icons.svg#i-users"></use></svg> ユーザー
                </button>
                <button type="button" class="tab-btn" id="adminModeBtn" onclick="setLoginMode('admin')">
                    <svg class="icon icon-sm"><use href="/icons.svg#i-tool"></use></svg> 管理者
                </button>
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" name="loginType" id="loginTypeInput" value="user">
                <input type="text" name="username" placeholder="ユーザー名" required>
                <input type="password" name="password" placeholder="パスワード" required>
                <button type="submit" class="btn-duo btn-primary" id="loginSubmitBtn">ログインする</button>
            </form>

            <script>
                function setLoginMode(mode) {
                    document.getElementById('loginTypeInput').value = mode;
                    document.getElementById('userModeBtn').classList.toggle('active', mode === 'user');
                    document.getElementById('adminModeBtn').classList.toggle('active', mode === 'admin');
                    document.getElementById('loginSubmitBtn').textContent = mode === 'admin' ? '管理者としてログイン' : 'ログインする';
                }
            </script>

            <a href="/register" class="auth-link">はじめての方はこちら（新規登録）</a>
            <a href="/forgot-password" class="auth-link">パスワードをお忘れですか？</a>
        </div>
    </div>
</body>
</html>
