# ★テスト実行時はPostgres（本番の habit_app）ではなく、使い捨てのH2インメモリDBに接続する。
# src/test/resources はテストのクラスパス上で src/main/resources より優先されるため、
# 本番用application.propertiesの設定を上書きできる。
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ★V1__baseline.sqlはPostgres専用のDDL（GENERATED BY DEFAULT AS IDENTITY等）なので、
# H2に対してFlywayを実行すると失敗する。テストはこれまで通りHibernateのcreate-dropに任せる。
spring.flyway.enabled=false

# ★テストはMockHttpSessionを直接スレッディングする既存のCtx/fetchCtxパターンに依存している。
# store-type=noneだけではSpring SessionのCookieSerializer等の関連Beanが残ってCSRFトークンの
# 紐付けが壊れてしまったため、オートコンフィグ自体を丸ごと除外して以前と全く同じ挙動に戻す。
spring.autoconfigure.exclude=org.springframework.boot.session.autoconfigure.SessionAutoConfiguration,org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
server.tomcat.max-http-form-post-size=-1

# JavaMailSenderのBean生成にはspring.mail.hostの存在だけが必要（起動時に実接続はしない）ため、
# テストでもダミー値を入れておく。実際に送信するテストはない。
spring.mail.host=localhost
app.base-url=http://localhost:8080

